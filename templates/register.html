<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
    <title>Регистрация | Business Stack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(145deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            position: relative;
        }
        /* Декоративные фоновые элементы */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -40%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            pointer-events: none;
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        .register-card {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            box-shadow: 0 40px 80px -20px rgba(0,0,0,0.35);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            animation: slideUp 0.7s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.15);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-header {
            background: linear-gradient(135deg, #fafbff 0%, #f0f2ff 100%);
            padding: 2.8rem 2.5rem 2rem;
            text-align: center;
            border-bottom: none;
            position: relative;
            overflow: hidden;
        }
        .card-header::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(102,126,234,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .card-header::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(118,75,162,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }
        .card-header .icon-wrapper {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 12px 35px rgba(102,126,234,0.35);
            position: relative;
            z-index: 1;
            transition: all 0.4s;
        }
        .card-header .icon-wrapper:hover {
            transform: rotate(-8deg) scale(1.05);
        }
        .card-header .icon-wrapper i {
            font-size: 2.2rem;
            color: white;
        }
        .card-header h1 {
            font-weight: 900;
            color: #1a202c;
            margin-bottom: 0.1rem;
            font-size: 2.1rem;
            letter-spacing: -1px;
            position: relative;
            z-index: 1;
        }
        .card-header .subtitle {
            color: #718096;
            margin-top: 0.5rem;
            font-size: 0.95rem;
            font-weight: 400;
            position: relative;
            z-index: 1;
        }
        .card-body { padding: 2rem 2.5rem 2.5rem; }
        
        .form-floating { margin-bottom: 1.25rem; }
        .form-floating label {
            font-weight: 600;
            color: #4a5568;
        }
        .form-floating label i {
            color: #a0aec0;
            width: 18px;
        }
        .form-control {
            border-radius: 18px;
            border: 2px solid #edf2f7;
            padding: 0.9rem 1.1rem;
            height: auto;
            font-size: 1rem;
            transition: all 0.3s;
            background: #fafbfc;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 5px rgba(102,126,234,0.12);
            background: white;
            transform: translateY(-1px);
        }
        .form-control::placeholder {
            color: #b0b8c8;
            font-weight: 300;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 18px;
            padding: 1.05rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        .btn-register:hover::before {
            left: 100%;
        }
        .btn-register:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -10px rgba(102,126,234,0.5);
        }
        .btn-register:active {
            transform: translateY(-1px);
        }
        .btn-register:disabled {
            opacity: 0.7;
            transform: none;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 14px 0 18px;
            padding: 6px 0;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.95rem;
        }
        .checkbox-group label i {
            color: #667eea;
            margin-right: 8px;
        }
        .org-fields { 
            display: none; 
            animation: expandIn 0.35s ease; 
        }
        .org-fields.show { display: block; }
        @keyframes expandIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 2px solid #f0f2ff;
            font-size: 0.95rem;
        }
        .footer-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            position: relative;
        }
        .footer-links a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        .footer-links a:hover::after {
            width: 100%;
        }
        .footer-links a:hover {
            color: #764ba2;
        }
        .terms {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 1rem;
        }
        .terms i {
            color: #667eea;
        }
        .remember-device {
            display: flex;
            align-items: center;
            gap: 14px;
            background: linear-gradient(135deg, #f8fafe, #f0f2ff);
            padding: 14px 20px;
            border-radius: 18px;
            margin: 18px 0 14px;
            border: 2px solid #edf2f7;
            transition: all 0.3s;
        }
        .remember-device:hover {
            border-color: #667eea;
            background: #f5f7ff;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102,126,234,0.08);
        }
        .remember-device input {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
            cursor: pointer;
            flex-shrink: 0;
        }
        .remember-device label {
            margin: 0;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .remember-device .hint {
            font-size: 0.75rem;
            color: #a0aec0;
            font-weight: 400;
            margin-left: 4px;
        }
        .field-with-domain {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }
        .field-with-domain .form-floating {
            flex: 1;
            margin-bottom: 0;
        }
        .domain-suffix-box {
            background: linear-gradient(135deg, #f0f2ff, #e8ebf9);
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 0.9rem 1.2rem;
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            min-width: 120px;
            justify-content: center;
            color: #667eea;
            transition: all 0.3s;
        }
        .domain-suffix-box i {
            color: #667eea;
            margin-right: 8px;
            font-size: 1.1rem;
        }
        .domain-suffix-box:hover {
            border-color: #667eea;
            background: linear-gradient(135deg, #e8ebf9, #dce1f5);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102,126,234,0.1);
        }
        
        .form-check {
            margin-top: 12px;
        }
        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }
        .form-check-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.2);
        }
        .form-check-label {
            color: #4a5568;
            font-weight: 500;
        }
        .form-check-label a {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        .form-check-label a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        /* Декоративная полоса внизу */
        .card-footer-decoration {
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2, #667eea);
            background-size: 200% 100%;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @media (max-width: 576px) {
            body { padding: 12px; }
            .card-header { padding: 1.8rem 1.5rem 1.2rem; }
            .card-body { padding: 1.5rem; }
            .field-with-domain { flex-direction: column; }
            .domain-suffix-box { 
                min-width: unset; 
                width: 100%;
                padding: 0.7rem 1rem;
            }
            .card-header .icon-wrapper {
                width: 60px;
                height: 60px;
            }
            .card-header .icon-wrapper i {
                font-size: 1.6rem;
            }
            .card-header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="card-header">
            <div class="icon-wrapper">
                <i class="fas fa-rocket"></i>
            </div>
            <h1>Business Stack</h1>
            <p class="subtitle">Создайте аккаунт для работы с бизнес-инструментами</p>
        </div>
        <div class="card-body">
            <form id="registerForm" autocomplete="off">
                <div class="form-floating">
                    <input type="text" class="form-control" id="name" placeholder="Ваше имя" required autocomplete="off">
                    <label for="name"><i class="fas fa-user me-2"></i>Имя и фамилия *</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="isOrganization">
                    <label for="isOrganization"><i class="fas fa-building"></i> Я регистрирую организацию/компанию</label>
                </div>
                
                <div id="orgFields" class="org-fields">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="organizationName" placeholder="Название организации" autocomplete="off">
                        <label for="organizationName"><i class="fas fa-building me-2"></i>Название организации</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="organizationInn" placeholder="ИНН" autocomplete="off">
                        <label for="organizationInn"><i class="fas fa-id-card me-2"></i>ИНН организации <span class="text-muted" style="font-weight:400;">(опционально)</span></label>
                    </div>
                </div>
                
                <div class="field-with-domain">
                    <div class="form-floating">
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="off">
                        <label for="email"><i class="fas fa-envelope me-2"></i>Email *</label>
                    </div>
                    <div class="domain-suffix-box">
                        <i class="fas fa-at"></i> @bstack.ru
                    </div>
                </div>
                
                <div class="form-floating">
                    <input type="tel" class="form-control" id="phone" placeholder="Телефон" autocomplete="off">
                    <label for="phone"><i class="fas fa-phone me-2"></i>Телефон <span class="text-muted" style="font-weight:400;">(опционально)</span></label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Пароль" required autocomplete="new-password">
                    <label for="password"><i class="fas fa-lock me-2"></i>Пароль *</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Подтверждение" required autocomplete="new-password">
                    <label for="confirmPassword"><i class="fas fa-check-circle me-2"></i>Подтвердите пароль *</label>
                </div>
                
                <div class="remember-device">
                    <input type="checkbox" id="rememberDevice" checked>
                    <label for="rememberDevice">
                        <i class="fas fa-laptop me-1"></i> Запомнить устройство 
                        <span class="hint">(не запрашивать код при входе)</span>
                    </label>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agree" required>
                    <label class="form-check-label" for="agree">
                        Я принимаю <a href="#">условия использования</a> и <a href="#">политику конфиденциальности</a>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-register" id="submitBtn">
                    <i class="fas fa-user-check me-2"></i>Создать аккаунт
                </button>
            </form>
            
            <div class="footer-links">
                Уже есть аккаунт? <a href="/login">Войти</a>
            </div>
            <div class="terms">
                <i class="fas fa-shield-alt me-1"></i> Ваши данные защищены
            </div>
        </div>
        <div class="card-footer-decoration"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== ПОКАЗ/СКРЫТИЕ ПОЛЕЙ ОРГАНИЗАЦИИ ==========
        const isOrgCheckbox = document.getElementById('isOrganization');
        const orgFields = document.getElementById('orgFields');
        if (isOrgCheckbox) {
            isOrgCheckbox.addEventListener('change', function() {
                orgFields.classList.toggle('show', this.checked);
            });
        }
        
        // ========== ОЧИСТКА ФОРМЫ ==========
        function clearRegisterForm() {
            const form = document.getElementById('registerForm');
            form.reset();
            orgFields.classList.remove('show');
            document.getElementById('isOrganization').checked = false;
            document.getElementById('agree').checked = false;
        }
        
        // ========== EMAIL РЕГИСТРАЦИЯ ==========
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert('Введите имя и фамилию');
                document.getElementById('name').focus();
                return;
            }
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) {
                alert('Пароли не совпадают!');
                document.getElementById('confirmPassword').focus();
                return;
            }
            if (password.length < 6) {
                alert('Пароль должен содержать минимум 6 символов');
                document.getElementById('password').focus();
                return;
            }
            
            const email = document.getElementById('email').value.trim();
            if (!email) {
                alert('Введите email');
                document.getElementById('email').focus();
                return;
            }
            
            if (!document.getElementById('agree').checked) {
                alert('Примите условия использования');
                return;
            }
            
            const phone = document.getElementById('phone').value.trim() || '';
            const isOrganization = document.getElementById('isOrganization').checked;
            const organizationName = isOrganization ? document.getElementById('organizationName').value.trim() : '';
            const organizationInn = isOrganization ? document.getElementById('organizationInn').value.trim() : '';
            const rememberDevice = document.getElementById('rememberDevice').checked;
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Регистрация...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email, password, name, phone,
                        is_organization: isOrganization,
                        organization_name: organizationName,
                        organization_inn: organizationInn,
                        remember_device: rememberDevice
                    })
                });
                const data = await response.json();
                
                if (response.ok) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                    }
                    clearRegisterForm();
                    alert('✅ Регистрация успешна! Перенаправление...');
                    setTimeout(() => { 
                        window.location.href = '/dashboard-improved'; 
                    }, 1500);
                } else {
                    alert('❌ ' + (data.error || 'Ошибка регистрации'));
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                alert('❌ Сетевая ошибка. Проверьте подключение к интернету.');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

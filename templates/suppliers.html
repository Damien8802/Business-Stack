<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поставщики | Business Stack</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* ============================================
           ГЛОБАЛЬНЫЕ СТИЛИ
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e17;
            color: #e0e6ed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* СКРОЛЛБАР */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        /* ============================================
           КОНТЕЙНЕР
           ============================================ */
        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ============================================
           HEADER
           ============================================ */
        .header {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(118, 75, 162, 0.15));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 30px 40px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(102, 126, 234, 0.1), transparent 60%);
            animation: headerGlow 8s ease-in-out infinite;
        }

        @keyframes headerGlow {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10%, -10%);
            }
        }

        .header-left {
            position: relative;
            z-index: 1;
        }

        .header-left h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 i {
            -webkit-text-fill-color: #667eea;
            font-size: 32px;
        }

        .header-left p {
            color: rgba(255, 255, 255, 0.5);
            margin: 4px 0 0 0;
            font-size: 14px;
            -webkit-text-fill-color: rgba(255, 255, 255, 0.5);
        }

        .header-right {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ============================================
           СТАТИСТИКА
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.1);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }
        .stat-icon.purple {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
        }
        .stat-icon.green {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }
        .stat-icon.orange {
            background: rgba(255, 159, 67, 0.15);
            color: #ff9f43;
        }
        .stat-icon.blue {
            background: rgba(54, 162, 235, 0.15);
            color: #36a2eb;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }

        .stat-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        /* ============================================
           КАРТОЧКИ
           ============================================ */
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: #667eea;
        }

        .card-badge {
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        /* ============================================
           ПОИСК
           ============================================ */
        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 10px 16px 10px 44px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .search-box input:focus {
            border-color: rgba(102, 126, 234, 0.4);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
        }

        /* ============================================
           КНОПКИ
           ============================================ */
        .btn-primary-custom {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.3);
            color: #fff;
        }

        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-outline-custom:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-danger-custom {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.2);
            color: #ff4757;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-danger-custom:hover {
            background: rgba(255, 71, 87, 0.25);
        }

        .btn-edit-custom {
            background: rgba(255, 159, 67, 0.15);
            border: 1px solid rgba(255, 159, 67, 0.2);
            color: #ff9f43;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.3s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-edit-custom:hover {
            background: rgba(255, 159, 67, 0.25);
        }

        /* ============================================
           ТАБЛИЦА
           ============================================ */
        .table-wrap {
            overflow-x: auto;
            margin: 0 -4px;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .table thead th {
            text-align: left;
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
            white-space: nowrap;
        }

        .table thead th:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .table thead th i {
            margin-left: 4px;
            font-size: 10px;
            opacity: 0.4;
        }

        .table tbody tr {
            transition: all 0.2s;
            cursor: pointer;
        }

        .table tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .table tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.8);
            vertical-align: middle;
        }

        .table tbody tr:last-child td {
            border-bottom: none;
        }

        /* Статусы */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.active {
            background: rgba(46, 213, 115, 0.15);
            color: #2ed573;
        }
        .status-badge.inactive {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-badge.active .dot {
            background: #2ed573;
        }
        .status-badge.inactive .dot {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Рейтинг звезды */
        .stars {
            color: #ff9f43;
            font-size: 14px;
            letter-spacing: 2px;
        }

        .stars .empty {
            color: rgba(255, 255, 255, 0.1);
        }

        /* ============================================
           ПАГИНАЦИЯ
           ============================================ */
        .pagination-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 12px;
        }

        .pagination-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }

        .pagination-buttons {
            display: flex;
            gap: 6px;
        }

        .pagination-buttons button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination-buttons button:hover:not(:disabled) {
            background: rgba(102, 126, 234, 0.15);
            border-color: rgba(102, 126, 234, 0.3);
            color: #fff;
        }

        .pagination-buttons button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-buttons button.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
        }

        /* ============================================
           МОДАЛЬНОЕ ОКНО
           ============================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-custom {
            background: #141b2b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header-custom h3 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin: 0;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: rgba(255, 255, 255, 0.4);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #ff4757;
            margin-left: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(102, 126, 234, 0.4);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group select option {
            background: #141b2b;
            color: #fff;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================
           TOAST
           ============================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #141b2b;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 24px;
            min-width: 300px;
            max-width: 500px;
            animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success {
            border-left: 3px solid #2ed573;
        }
        .toast.error {
            border-left: 3px solid #ff4757;
        }
        .toast.warning {
            border-left: 3px solid #ff9f43;
        }
        .toast.info {
            border-left: 3px solid #667eea;
        }

        .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        .toast.success .toast-icon {
            color: #2ed573;
        }
        .toast.error .toast-icon {
            color: #ff4757;
        }
        .toast.warning .toast-icon {
            color: #ff9f43;
        }
        .toast.info .toast-icon {
            color: #667eea;
        }

        .toast-content {
            flex: 1;
        }
        .toast-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }
        .toast-message {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* ============================================
           SKELETON
           ============================================ */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.06) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: skeleton 1.5s infinite;
            border-radius: 6px;
        }

        @keyframes skeleton {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* ============================================
           АДАПТИВНОСТЬ
           ============================================ */
        @media (max-width: 768px) {
            .app-container {
                padding: 12px;
            }
            .header {
                padding: 20px;
                flex-direction: column;
                align-items: stretch;
            }
            .header-left h1 {
                font-size: 22px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stat-value {
                font-size: 22px;
            }
            .modal-custom {
                padding: 20px;
                margin: 10px;
            }
            .toast {
                min-width: auto;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-right {
                flex-wrap: wrap;
            }
            .header-right .btn-primary-custom {
                width: 100%;
                justify-content: center;
            }
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================
    ОСНОВНОЙ КОНТЕЙНЕР
    ============================================ -->
    <div class="app-container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <h1>
                    <i class="fas fa-truck"></i>
                    Поставщики
                </h1>
                <p id="lastUpdate">🔄 Обновлено: только что</p>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input
                    type="text"
                    id="searchInput"
                    placeholder="Поиск по названию, ИНН, контакту..."
                    >
                </div>
                <button class="btn-primary-custom" id="addSupplierBtn">
                    <i class="fas fa-plus"></i> Добавить
                </button>
                <button class="btn-outline-custom" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-icon purple"><i class="fas fa-building"></i></div>
                <div class="stat-value" id="totalSuppliers">0</div>
                <div class="stat-label">Всего поставщиков</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="activeSuppliers">0</div>
                <div class="stat-label">Активных</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="fas fa-star"></i></div>
                <div class="stat-value" id="avgRating">0.0</div>
                <div class="stat-label">Средний рейтинг</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Всего заказов</div>
            </div>
        </div>

        <!-- ===== ТАБЛИЦА ===== -->
        <div class="card">
            <div class="card-header-custom">
                <div class="card-title">
                    <i class="fas fa-list"></i>
                    Список поставщиков
                    <span class="card-badge" id="suppliersCount">0</span>
                </div>
                <div>
                    <select id="statusFilter" class="form-select-sm" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;">
                        <option value="all">Все статусы</option>
                        <option value="active">Активные</option>
                        <option value="inactive">Неактивные</option>
                    </select>
                </div>
            </div>

            <div class="table-wrap">
                <table class="table" id="suppliersTable">
                    <thead>
                        <tr>
                            <th data-sort="name">Название <i class="fas fa-sort"></i></th>
                            <th data-sort="inn">ИНН <i class="fas fa-sort"></i></th>
                            <th>Контакты</th>
                            <th data-sort="rating">Рейтинг <i class="fas fa-sort"></i></th>
                            <th data-sort="total_orders">Заказов <i class="fas fa-sort"></i></th>
                            <th>Статус</th>
                            <th style="text-align:right;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="suppliersBody">
                        <!-- Skeleton loading -->
                        <tr>
                            <td><div class="skeleton" style="height:20px;width:140px;"></div></td>
                            <td><div class="skeleton" style="height:20px;width:100px;"></div></td>
                            <td>
                                <div class="skeleton" style="height:16px;width:120px;margin-bottom:4px;"></div>
                                <div class="skeleton" style="height:16px;width:150px;"></div>
                            </td>
                            <td><div class="skeleton" style="height:20px;width:80px;"></div></td>
                            <td><div class="skeleton" style="height:20px;width:40px;"></div></td>
                            <td><div class="skeleton" style="height:24px;width:80px;border-radius:20px;"></div></td>
                            <td style="text-align:right;">
                                <div class="skeleton" style="height:32px;width:120px;border-radius:8px;display:inline-block;"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Пагинация -->
            <div class="pagination-wrap">
                <div class="pagination-info" id="paginationInfo">Показано 0 из 0</div>
                <div class="pagination-buttons" id="paginationButtons">
                    <button id="prevPage" disabled><i class="fas fa-chevron-left"></i></button>
                    <button class="active">1</button>
                    <button id="nextPage"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================
    МОДАЛЬНОЕ ОКНО - ДОБАВЛЕНИЕ/РЕДАКТИРОВАНИЕ
    ============================================ -->
    <div class="modal-overlay" id="supplierModal">
        <div class="modal-custom">
            <div class="modal-header-custom">
                <h3 id="modalTitle"><i class="fas fa-plus-circle" style="color:#667eea;"></i> Добавить поставщика</h3>
                <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
            </div>
            <form id="supplierForm">
                <input type="hidden" id="supplierId" value="">

                <div class="form-group">
                    <label>Название компании <span class="required">*</span></label>
                    <input type="text" id="supplierName" placeholder="ООО 'Рога и Копыта'" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>ИНН</label>
                        <input type="text" id="supplierInn" placeholder="7700000000" maxlength="12">
                    </div>
                    <div class="form-group">
                        <label>КПП</label>
                        <input type="text" id="supplierKpp" placeholder="770000000" maxlength="9">
                    </div>
                </div>

                <div class="form-group">
                    <label>ОГРН</label>
                    <input type="text" id="supplierOgrn" placeholder="1234567890123" maxlength="13">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="text" id="supplierPhone" placeholder="+7 (999) 123-45-67">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="supplierEmail" placeholder="info@company.ru">
                    </div>
                </div>

                <div class="form-group">
                    <label>Адрес</label>
                    <input type="text" id="supplierAddress" placeholder="г. Москва, ул. Ленина, д. 1">
                </div>

                <div class="form-group">
                    <label>Контактное лицо</label>
                    <input type="text" id="supplierContact" placeholder="Иванов Иван Иванович">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Банк</label>
                        <input type="text" id="supplierBank" placeholder="Сбербанк">
                    </div>
                    <div class="form-group">
                        <label>БИК</label>
                        <input type="text" id="supplierBik" placeholder="044525225">
                    </div>
                </div>

                <div class="form-group">
                    <label>Расчетный счет</label>
                    <input type="text" id="supplierAccount" placeholder="40702810900000000000">
                </div>

                <div class="form-group">
                    <label>Примечания</label>
                    <textarea id="supplierNotes" rows="2" placeholder="Дополнительная информация"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-outline-custom" id="modalCancel">Отмена</button>
                    <button type="submit" class="btn-primary-custom" id="modalSubmit">
                        <i class="fas fa-save"></i> Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================
    TOAST КОНТЕЙНЕР
    ============================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // 1. СОСТОЯНИЕ
        // ============================================
        const state = {
            suppliers: [],
            currentPage: 1,
            pageSize: 20,
            total: 0,
            search: '',
            statusFilter: 'all',
            sortBy: 'name',
            sortOrder: 'asc',
            editingId: null,
        };

        // ============================================
        // 2. DOM ЭЛЕМЕНТЫ
        // ============================================
        const $ = (id) => document.getElementById(id);

        const suppliersBody = $('suppliersBody');
        const totalSuppliers = $('totalSuppliers');
        const activeSuppliers = $('activeSuppliers');
        const avgRating = $('avgRating');
        const totalOrders = $('totalOrders');
        const suppliersCount = $('suppliersCount');
        const searchInput = $('searchInput');
        const statusFilter = $('statusFilter');
        const paginationInfo = $('paginationInfo');
        const paginationButtons = $('paginationButtons');
        const prevPage = $('prevPage');
        const nextPage = $('nextPage');
        const lastUpdate = $('lastUpdate');

        // ============================================
        // 3. API КЛИЕНТ
        // ============================================
        const api = {
            getSuppliers: async (params) => {
                const qs = new URLSearchParams(params).toString();
                const res = await fetch(`/api/suppliers?${qs}`);
                if (!res.ok) throw new Error('Ошибка загрузки');
                return res.json();
            },

            getStats: async () => {
                const res = await fetch('/api/suppliers/stats');
                if (!res.ok) throw new Error('Ошибка загрузки статистики');
                return res.json();
            },

            createSupplier: async (data) => {
                const res = await fetch('/api/suppliers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                if (!res.ok) throw new Error('Ошибка создания');
                return res.json();
            },

            updateSupplier: async (id, data) => {
                const res = await fetch(`/api/suppliers/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });
                if (!res.ok) throw new Error('Ошибка обновления');
                return res.json();
            },

            deleteSupplier: async (id) => {
                const res = await fetch(`/api/suppliers/${id}`, {
                    method: 'DELETE',
                });
                if (!res.ok) throw new Error('Ошибка удаления');
                return res.json();
            },
        };

        // ============================================
        // 4. ОСНОВНЫЕ ФУНКЦИИ
        // ============================================

        // Загрузка поставщиков
        async function loadSuppliers() {
            try {
                const params = {
                    page: state.currentPage,
                    page_size: state.pageSize,
                    search: state.search,
                    active: state.statusFilter === 'all' ? '' : state.statusFilter === 'active' ? 'true' :
                    'false',
                    sort: state.sortBy,
                    order: state.sortOrder,
                };

                const data = await api.getSuppliers(params);
                state.suppliers = data.suppliers || [];
                state.total = data.count || 0;

                renderSuppliers();
                renderPagination();
                updateLastUpdate();

            } catch (error) {
                showToast('Ошибка загрузки', error.message, 'error');
                suppliersBody.innerHTML = `
                        <tr><td colspan="7" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                            <i class="fas fa-exclamation-circle" style="font-size:24px;display:block;margin-bottom:8px;"></i>
                            Не удалось загрузить поставщиков
                        </td></tr>
                    `;
            }
        }

        // Загрузка статистики
        async function loadStats() {
            try {
                const data = await api.getStats();
                const stats = data.stats || {};

                totalSuppliers.textContent = stats.total_suppliers || 0;
                activeSuppliers.textContent = stats.active_suppliers || 0;
                avgRating.textContent = (stats.avg_rating || 0).toFixed(1);
                totalOrders.textContent = stats.total_orders || 0;
                suppliersCount.textContent = stats.total_suppliers || 0;

            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // Рендер поставщиков
        function renderSuppliers() {
            if (state.suppliers.length === 0) {
                suppliersBody.innerHTML = `
                        <tr><td colspan="7" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                            <i class="fas fa-building" style="font-size:32px;display:block;margin-bottom:12px;"></i>
                            Нет поставщиков
                            <br><small>Нажмите "Добавить" чтобы создать первого поставщика</small>
                        </td></tr>
                    `;
                return;
            }

            suppliersBody.innerHTML = state.suppliers.map(s => {
                const stars = renderStars(s.rating || 0);
                const statusClass = s.active ? 'active' : 'inactive';
                const statusLabel = s.active ? 'Активен' : 'Неактивен';

                return `
                        <tr data-id="${s.id}">
                            <td>
                                <strong>${escapeHtml(s.name)}</strong>
                                <div style="font-size:12px;color:rgba(255,255,255,0.3);">${escapeHtml(s.contact_person) || '—'}</div>
                            </td>
                            <td style="font-family:monospace;font-size:13px;color:rgba(255,255,255,0.5);">
                                ${s.inn || '—'}
                                ${s.kpp ? `<span style="font-size:11px;color:rgba(255,255,255,0.2);"> / ${s.kpp}</span>` : ''}
                            </td>
                            <td>
                                ${s.phone ? `<div><i class="fas fa-phone" style="font-size:12px;color:rgba(255,255,255,0.3);width:16px;"></i> ${escapeHtml(s.phone)}</div>` : ''}
                                ${s.email ? `<div><i class="fas fa-envelope" style="font-size:12px;color:rgba(255,255,255,0.3);width:16px;"></i> ${escapeHtml(s.email)}</div>` : ''}
                            </td>
                            <td>
                                <div class="stars">${stars}</div>
                                <div style="font-size:11px;color:rgba(255,255,255,0.2);">${s.total_orders || 0} заказов</div>
                            </td>
                            <td style="text-align:center;font-size:14px;">${s.total_orders || 0}</td>
                            <td><span class="status-badge ${statusClass}">
                                <span class="dot"></span> ${statusLabel}
                            </span></td>
                            <td style="text-align:right;white-space:nowrap;">
                                <button class="btn-edit-custom" onclick="editSupplier('${s.id}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-danger-custom" onclick="deleteSupplier('${s.id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
            }).join('');
        }

        // Рендер звезд рейтинга
        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;

            let stars = '';
            for (let i = 0; i < full; i++) stars += '⭐';
            if (half) stars += '⭐';
            for (let i = 0; i < empty; i++) stars += '<span class="empty">☆</span>';

            return stars;
        }

        // Пагинация
        function renderPagination() {
            const totalPages = Math.ceil(state.total / state.pageSize) || 1;
            const start = (state.currentPage - 1) * state.pageSize + 1;
            const end = Math.min(state.currentPage * state.pageSize, state.total);

            paginationInfo.textContent = `Показано ${state.total > 0 ? start : 0}–${end} из ${state.total}`;

            let html = '';
            html += `<button id="prevPage" ${state.currentPage <= 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>`;

            let startPage = Math.max(1, state.currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            if (endPage - startPage < 4) {
                startPage = Math.max(1, endPage - 4);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === state.currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            html += `<button id="nextPage" ${state.currentPage >= totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>`;

            paginationButtons.innerHTML = html;

            // Обработчики
            paginationButtons.querySelector('#prevPage')?.addEventListener('click', () => {
                if (state.currentPage > 1) {
                    state.currentPage--;
                    loadSuppliers();
                }
            });

            paginationButtons.querySelector('#nextPage')?.addEventListener('click', () => {
                if (state.currentPage < totalPages) {
                    state.currentPage++;
                    loadSuppliers();
                }
            });

            paginationButtons.querySelectorAll('[data-page]').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.currentPage = parseInt(btn.dataset.page);
                    loadSuppliers();
                });
            });
        }

        // Обновление времени
        function updateLastUpdate() {
            const now = new Date();
            lastUpdate.textContent = `🔄 Обновлено: ${now.toLocaleTimeString('ru-RU')}`;
        }

        // ============================================
        // 5. МОДАЛЬНОЕ ОКНО
        // ============================================

        // Открыть модалку для добавления
        $('addSupplierBtn').addEventListener('click', () => {
            state.editingId = null;
            $('modalTitle').innerHTML = '<i class="fas fa-plus-circle" style="color:#667eea;"></i> Добавить поставщика';
            $('modalSubmit').innerHTML = '<i class="fas fa-save"></i> Сохранить';
            $('supplierForm').reset();
            $('supplierId').value = '';
            $('supplierModal').classList.add('active');
        });

        // Открыть модалку для редактирования
        function editSupplier(id) {
            const supplier = state.suppliers.find(s => s.id === id);
            if (!supplier) return;

            state.editingId = id;
            $('modalTitle').innerHTML = '<i class="fas fa-edit" style="color:#ff9f43;"></i> Редактировать поставщика';
            $('modalSubmit').innerHTML = '<i class="fas fa-save"></i> Обновить';
            $('supplierId').value = id;
            $('supplierName').value = supplier.name || '';
            $('supplierInn').value = supplier.inn || '';
            $('supplierKpp').value = supplier.kpp || '';
            $('supplierOgrn').value = supplier.ogrn || '';
            $('supplierPhone').value = supplier.phone || '';
            $('supplierEmail').value = supplier.email || '';
            $('supplierAddress').value = supplier.address || '';
            $('supplierContact').value = supplier.contact_person || '';
            $('supplierBank').value = supplier.bank_name || '';
            $('supplierBik').value = supplier.bik || '';
            $('supplierAccount').value = supplier.bank_account || '';
            $('supplierNotes').value = supplier.notes || '';
            $('supplierModal').classList.add('active');
        }

        // Закрыть модалку
        function closeModal() {
            $('supplierModal').classList.remove('active');
        }

        $('modalClose').addEventListener('click', closeModal);
        $('modalCancel').addEventListener('click', closeModal);
        $('supplierModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // Сабмит формы
        $('supplierForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: $('supplierName').value.trim(),
                inn: $('supplierInn').value.trim(),
                kpp: $('supplierKpp').value.trim(),
                ogrn: $('supplierOgrn').value.trim(),
                phone: $('supplierPhone').value.trim(),
                email: $('supplierEmail').value.trim(),
                address: $('supplierAddress').value.trim(),
                contact_person: $('supplierContact').value.trim(),
                bank_name: $('supplierBank').value.trim(),
                bik: $('supplierBik').value.trim(),
                bank_account: $('supplierAccount').value.trim(),
                notes: $('supplierNotes').value.trim(),
                active: true,
            };

            if (!data.name) {
                showToast('Ошибка', 'Название компании обязательно', 'error');
                return;
            }

            try {
                let result;
                if (state.editingId) {
                    result = await api.updateSupplier(state.editingId, data);
                    showToast('Успех', 'Поставщик обновлен', 'success');
                } else {
                    result = await api.createSupplier(data);
                    showToast('Успех', 'Поставщик добавлен', 'success');
                }

                closeModal();
                await loadSuppliers();
                await loadStats();

            } catch (error) {
                showToast('Ошибка', error.message, 'error');
            }
        });

        // ============================================
        // 6. УДАЛЕНИЕ
        // ============================================
        async function deleteSupplier(id) {
            const supplier = state.suppliers.find(s => s.id === id);
            if (!supplier) return;

            if (!confirm(`Вы уверены, что хотите удалить поставщика "${supplier.name}"?`)) return;

            try {
                await api.deleteSupplier(id);
                showToast('Успех', 'Поставщик удален', 'success');
                await loadSuppliers();
                await loadStats();
            } catch (error) {
                showToast('Ошибка', error.message, 'error');
            }
        }

        // ============================================
        // 7. TOAST УВЕДОМЛЕНИЯ
        // ============================================
        function showToast(title, message, type = 'info') {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-times-circle',
                warning: 'fa-exclamation-circle',
                info: 'fa-info-circle',
            };

            toast.innerHTML = `
                    <div class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></div>
                    <div class="toast-content">
                        <div class="toast-title">${escapeHtml(title)}</div>
                        <div class="toast-message">${escapeHtml(message)}</div>
                    </div>
                `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // ============================================
        // 8. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // 9. ОБНОВЛЕНИЕ
        // ============================================
        $('refreshBtn').addEventListener('click', async () => {
            $('refreshBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            await loadSuppliers();
            await loadStats();
            $('refreshBtn').innerHTML = '<i class="fas fa-sync-alt"></i>';
            showToast('Обновлено', 'Данные обновлены', 'success');
        });

        // ============================================
        // 10. ПОИСК И ФИЛЬТРЫ
        // ============================================
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.search = searchInput.value.trim();
                state.currentPage = 1;
                loadSuppliers();
            }, 500);
        });

        statusFilter.addEventListener('change', () => {
            state.statusFilter = statusFilter.value;
            state.currentPage = 1;
            loadSuppliers();
        });

        // ============================================
        // 11. СОРТИРОВКА
        // ============================================
        document.querySelectorAll('[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const sortBy = th.dataset.sort;
                if (state.sortBy === sortBy) {
                    state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
                } else {
                    state.sortBy = sortBy;
                    state.sortOrder = 'asc';
                }
                loadSuppliers();
            });
        });

        // ============================================
        // 12. ЗАПУСК
        // ============================================
        async function init() {
            await loadSuppliers();
            await loadStats();

            // Авто-обновление каждые 30 секунд
            setInterval(() => {
                loadStats();
                loadSuppliers();
            }, 30000);
        }

        // Запускаем
        init();

        // ============================================
        // 13. WEBSOCKET ДЛЯ РЕАЛЬНОГО ВРЕМЕНИ
        // ============================================
        function connectWebSocket() {
            const ws = new WebSocket('ws://localhost:8080/ws/suppliers');

            ws.onopen = () => {
                console.log('✅ WebSocket connected (suppliers)');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('📡 Supplier event:', data);

                    switch (data.type) {
                        case 'supplier_updated':
                        case 'supplier_created':
                        case 'supplier_deleted':
                            loadSuppliers();
                            loadStats();
                            break;
                        case 'alert':
                            showToast('⚠️ Внимание', data.message, 'warning');
                            break;
                    }
                } catch (e) {
                    console.error('WebSocket parse error:', e);
                }
            };

            ws.onclose = () => {
                console.log('❌ WebSocket disconnected, reconnecting in 5s...');
                setTimeout(connectWebSocket, 5000);
            };
        }

        setTimeout(connectWebSocket, 2000);
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
